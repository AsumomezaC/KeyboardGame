<!doctype html>
<html lang="es-419">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página no encontrada · La Historia de Sofía</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#1d1b33">
  <style>
    :root { --bg: #1d1b33; --ink: #2b1d2e; --cream: #fff7e0; --gold: #c9a66b; --hint: #ffd23f; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg);
      font: 17px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main {
      max-width: 520px; margin: 16px; padding: 24px 28px; text-align: center; background: var(--cream); color: var(--ink);
      border: 4px solid var(--ink); border-radius: 10px; box-shadow: inset 0 0 0 3px var(--gold);
    }
    .code { font-size: 3.4rem; font-weight: 800; color: #b83350; margin: 0; letter-spacing: 4px; }
    h1 { font-size: 1.4rem; margin: 4px 0 8px; }
    svg { width: 96px; height: 64px; }
    a.btn {
      display: inline-block; margin-top: 14px; padding: 6px 18px; background: var(--hint); color: var(--ink);
      border: 3px solid var(--ink); border-bottom-width: 5px; border-radius: 8px; text-decoration: none; font-weight: 600;
    }
  </style>
</head>
<body>
  <main>
    <!-- Un cono de obra en pixel art: esta calle está cerrada. -->
    <svg viewBox="0 0 12 8" aria-hidden="true" shape-rendering="crispEdges">
      <rect x="5" y="0" width="2" height="2" fill="#f77f00"/><rect x="4" y="2" width="4" height="2" fill="#ffffff"/>
      <rect x="4" y="4" width="4" height="2" fill="#f77f00"/><rect x="2" y="6" width="8" height="2" fill="#f77f00"/>
    </svg>
    <p class="code">404</p>
    <h1>Esta calle no existe</h1>
    <p>Sofía corrió por todo el barrio y no encontró esta página. Quizá el enlace está mal escrito o ya no existe.</p>
    <a class="btn" href="/">Volver al juego</a>
  </main>
</body>
</html>
